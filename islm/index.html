<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IS-LM Dashboard</title>
  <style>
    /* Make iframe fill the viewport */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #islm-frame {
      width: 100%;
      height: 100%; /* Fill the entire viewport */
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    id="islm-frame"
    src="https://interactive-islm.vercel.app"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-forms"
  ></iframe>
</body>
</html>
