<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- 1. Make it responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>IS-LM Dashboard</title>
  <style>
    /* 2. Zero out margins, force full‐screen, hide overflow */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f9fafb; /* light gray background */
    }

    /* 3. Position iframe absolutely so it spans the entire viewport */
    #islm-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    id="islm-frame"
    src="https://interactive-islm.vercel.app"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-forms"
  ></iframe>
</body>
</html>
